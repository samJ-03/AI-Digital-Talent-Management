name: ai-talent-dev
services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_ROOT_PASSWORD: ${TALENT_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: talent_dev
      MYSQL_USER: talent
      MYSQL_PASSWORD: ${TALENT_MYSQL_PASSWORD:?required}
    command: [--default-time-zone=+00:00]
    ports: ["127.0.0.1:13306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m
  mysql-test:
    profiles: [test]
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_ROOT_PASSWORD: ${TALENT_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: talent_test
      MYSQL_USER: talent
      MYSQL_PASSWORD: ${TALENT_MYSQL_PASSWORD:?required}
    command: [--default-time-zone=+00:00]
    volumes: [mysql-test-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  redis:
    image: redis@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    environment:
      REDIS_PASSWORD: ${TALENT_REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:16379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${TALENT_MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${TALENT_MINIO_PASSWORD:?required}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 384m
  etcd:
    image: quay.io/coreos/etcd@sha256:89b6debd43502d1088f3e02f39442fd3e951aa52bee846ed601cf4477114b89e
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes: [etcd-data:/etcd]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health, --endpoints=http://localhost:2379]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  milvus:
    image: milvusdb/milvus@sha256:fb57464669737ee9a9c43c6faa891527adab601241b0b488091c5f4eb4a13178
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${TALENT_MINIO_USER:?required}
      MINIO_SECRET_ACCESS_KEY: ${TALENT_MINIO_PASSWORD:?required}
      MINIO_BUCKET_NAME: milvus-internal
    ports: ["127.0.0.1:19630:19530"]
    volumes: [milvus-data:/var/lib/milvus]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g
  mailpit:
    image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
    mem_limit: 128m
  api:
    image: ai-talent-api:dev
    build: {context: .., dockerfile: backend/Dockerfile}
    environment: &app-environment
      TALENT_ENVIRONMENT: ${TALENT_ENVIRONMENT:-dev}
      TALENT_DATABASE_URL: ${TALENT_DATABASE_URL:?required}
      TALENT_TEST_DATABASE_URL: ${TALENT_TEST_DATABASE_URL:?required}
      TALENT_REDIS_URL: ${TALENT_REDIS_URL:?required}
      TALENT_MONITOR_TOKEN: ${TALENT_MONITOR_TOKEN:?required}
      TALENT_MILVUS_URI: ${TALENT_MILVUS_URI:-http://milvus:19530}
      TALENT_SEMANTIC_TOP_K: ${TALENT_SEMANTIC_TOP_K:-200}
      TALENT_SEMANTIC_MIN_RELEVANCE: ${TALENT_SEMANTIC_MIN_RELEVANCE:-0.0}
      TALENT_MINIO_USER: ${TALENT_MINIO_USER:?required}
      TALENT_MINIO_PASSWORD: ${TALENT_MINIO_PASSWORD:?required}
      TALENT_MINIO_ENDPOINT: ${TALENT_MINIO_ENDPOINT:-minio:9000}
      TALENT_MINIO_BUCKET: ${TALENT_MINIO_BUCKET:-talent-business}
      TALENT_MINIO_SECURE: ${TALENT_MINIO_SECURE:-false}
      TALENT_MAX_FILE_BYTES: ${TALENT_MAX_FILE_BYTES:-20971520}
      TALENT_MAX_FILE_PAGES: ${TALENT_MAX_FILE_PAGES:-100}
      TALENT_SESSION_NAMESPACE: ${TALENT_SESSION_NAMESPACE:-talent:staff}
      TALENT_TRUSTED_ORIGINS: '${TALENT_TRUSTED_ORIGINS:-["http://localhost:13000","http://127.0.0.1:13000"]}'
      TALENT_ALLOWED_SMTP_HOSTS: '${TALENT_ALLOWED_SMTP_HOSTS:-["mailpit"]}'
      TALENT_ENCRYPTION_KEY: ${TALENT_ENCRYPTION_KEY:-}
      TALENT_DASHSCOPE_API_KEY: ${TALENT_DASHSCOPE_API_KEY:-}
      TALENT_DEEPSEEK_API_KEY: ${TALENT_DEEPSEEK_API_KEY:-}
    ports: ["127.0.0.1:18080:8000"]
    volumes: &app-volumes [../backend:/app/backend:ro, ../scripts:/app/scripts:ro]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
  worker:
    image: ai-talent-api:dev
    environment: *app-environment
    volumes: *app-volumes
    command: [celery, -A, 'app.runtime.worker:celery_app', worker, --loglevel=WARNING, --concurrency=1, --without-gossip, --without-mingle]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.runtime.health, worker]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: 768m
  scheduler:
    image: ai-talent-api:dev
    environment: *app-environment
    volumes: *app-volumes
    command: [python, -m, app.runtime.scheduler]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.runtime.health, scheduler]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 10s
    stop_grace_period: 10s
    mem_limit: 256m
  frontend:
    image: ai-talent-frontend:dev
    build: {context: .., dockerfile: frontend/Dockerfile}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  nginx:
    image: nginx@sha256:abe47724e466aeab9a345d8e46a221c2fa8953c7848bb4a3bd9976a7199f8cf2
    ports: ["127.0.0.1:13000:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost/api/v1/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
volumes:
  mysql-data:
  mysql-test-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
