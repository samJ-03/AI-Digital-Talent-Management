name: Core and retained-backend checks
'on': [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Create disposable project configuration
        run: python scripts/init_env.py
      - name: Build locked Python images
        run: |
          docker build -f infra/Dockerfile.runtime -t ai-talent-runtime:dev .
          python scripts/compose.py build api
      - name: Start isolated test dependencies including retained semantic backend
        run: python scripts/compose.py --profile test --profile semantic up -d --wait mysql mysql-test redis minio etcd milvus mailpit
      - name: Backend regression with synthetic provider transports
        run: python scripts/compose.py run --rm -T --no-deps -v "$PWD:/work:ro" -w /work api python -m pytest -q -p no:cacheprovider
      - name: Export current schemas without refreshing reviewed manifest
        run: |
          mkdir -p artifacts
          python scripts/compose.py run --rm -T --no-deps -v "$PWD:/work:ro" -w /work api python scripts/export_openapi.py --output - > artifacts/openapi.json
      - name: Check reviewed implemented contracts and explicit pending scope
        run: python scripts/check_contract_coverage.py --manifest docs/api-manifest.json --openapi artifacts/openapi.json
      - name: Install locked frontend tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Generate API types and detect drift
        run: |
          npm --prefix frontend run generate:api
          git diff --exit-code -- frontend/src/generated/api-types.ts
      - name: Frontend checks
        run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
        env: {NEXT_TELEMETRY_DISABLED: '1'}
      - name: Stop disposable project services
        if: always()
        run: python scripts/compose.py --profile test --profile semantic down
