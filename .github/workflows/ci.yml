name: Core checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TALENT_TEST_DATABASE_URL: mysql+pymysql://talent:ci-only-ephemeral@127.0.0.1:3306/talent_test?charset=utf8mb4
      TALENT_REDIS_URL: redis://127.0.0.1:6379/0
      TALENT_MINIO_ENDPOINT: 127.0.0.1:9000
      TALENT_MINIO_USER: ci-only-user
      TALENT_MINIO_PASSWORD: ci-only-ephemeral-minio
    services:
      redis:
        image: redis@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
      mysql:
        image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: ci-only-ephemeral-root
          MYSQL_DATABASE: talent_test
          MYSQL_USER: talent
          MYSQL_PASSWORD: ci-only-ephemeral
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install -r backend/requirements.lock
      - name: Start isolated MinIO
        run: docker run --detach --name talent-ci-minio --publish 9000:9000 --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
        env:
          MINIO_ROOT_USER: ci-only-user
          MINIO_ROOT_PASSWORD: ci-only-ephemeral-minio
      - name: Wait for MinIO readiness
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9000/minio/health/ready',timeout=2) as response:
                      if response.status==200: break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('CI MinIO did not become ready')
          PY
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
        env: {NEXT_TELEMETRY_DISABLED: '1'}
